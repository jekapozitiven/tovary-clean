<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Поиск товара по артикулу</title>
<link rel="icon" href="../../favicon.svg">
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --line:#e3e8ef; --text:#1f2733; --dim:#6b7686;
    --accent:#2563eb; --ok:#15803d; --warn:#b45309; --err:#b91c1c; --chip:#eef2f7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:28px 16px 70px}
  h1{font-size:22px;margin:0 0 4px;text-align:center}
  .sub{color:var(--dim);text-align:center;margin:0 0 22px;font-size:14px}
  .searchbar{display:flex;gap:10px;position:sticky;top:0;background:var(--bg);padding:8px 0 12px;z-index:5}
  #q{flex:1;font-size:19px;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--text)}
  #q:focus{outline:none;border-color:var(--accent)}
  #go{font-size:18px;font-weight:600;padding:0 26px;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
  #go:disabled{opacity:.6}
  .status{text-align:center;color:var(--dim);margin:22px 0;font-size:15px}
  .status.err{color:var(--err)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:0 1px 3px rgba(20,30,50,.06);margin-top:8px}
  .top{display:flex;gap:18px;padding:18px;flex-wrap:wrap}
  .gallery{flex:0 0 420px;max-width:100%}
  .gallery .main{width:100%;border:1px solid var(--line);border-radius:12px;background:#fafbfc;overflow:hidden}
  .gallery .main img{width:100%;height:auto;display:block;max-height:600px;object-fit:contain;cursor:zoom-in}
  .thumbs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .thumbs img{width:64px;height:64px;object-fit:cover;border:1px solid var(--line);border-radius:8px;cursor:pointer}
  .thumbs img.sel{border-color:var(--accent)}
  .info{flex:1 1 300px;min-width:260px}
  .name{font-size:20px;font-weight:700;margin:0 0 6px}
  .cat{display:inline-block;background:var(--chip);color:var(--dim);font-size:12.5px;padding:3px 9px;border-radius:20px;margin-bottom:10px}
  .art{font-size:15px;color:var(--dim);margin:0 0 12px}
  .art b{color:var(--text);font-size:17px}
  table.stores{width:100%;border-collapse:collapse;margin-top:6px;font-size:14.5px}
  table.stores th,table.stores td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  table.stores th{color:var(--dim);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.02em}
  .price{font-weight:700;white-space:nowrap}
  .old{color:var(--dim);text-decoration:line-through;font-size:13px;margin-left:6px}
  .pres{font-size:13.5px}
  .pres.yes{color:var(--ok)}.pres.no{color:var(--err)}
  .avail{display:inline-block;margin-top:8px;font-size:17px;font-weight:700;padding:8px 16px;border-radius:10px}
  .avail.yes{color:#0f7a33;background:#e7f6ec}
  .avail.no{color:#a51f1f;background:#fbeaea}
  .hidden-badge{color:var(--warn);font-size:12px}
  .results{margin-top:8px}
  .ritem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-size:15px}
  .ritem:hover{border-color:var(--accent)}
  .ritem img{width:44px;height:44px;object-fit:cover;border-radius:8px;background:#f0f2f5;flex:0 0 44px}
  .ritem .rn{font-weight:600}
  .ritem .ra{color:var(--dim);font-size:13px}
  .desc{padding:0 18px 20px}
  .desc h3{font-size:14px;color:var(--dim);text-transform:uppercase;letter-spacing:.03em;margin:6px 0 8px}
  .desc-body{font-size:14px;line-height:1.55;border-top:1px solid var(--line);padding-top:12px;max-height:520px;overflow:auto;color:var(--text)}
  /* единый комфортный размер и обычная толщина для описаний из любых магазинов */
  .desc-body, .desc-body *{font-size:14px !important;font-weight:400 !important;line-height:1.55 !important;letter-spacing:normal !important}
  .desc-body img{max-width:100% !important;height:auto !important}
  .lightbox{position:fixed;inset:0;background:rgba(8,12,20,.92);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
  .lightbox.on{display:flex}
  .lightbox img{width:auto;height:auto;max-width:97vw;max-height:97vh;object-fit:contain;border-radius:8px}
  .fit{display:inline-block;margin:8px 0 0;font-size:14.5px;color:#8a5a00;background:#fdf3e0;border:1px solid #f2dcae;
    border-radius:8px;padding:6px 12px}
  .note{margin:8px 0 0;font-size:14px;color:var(--text);background:#f1f4f8;border:1px solid var(--line);
    border-radius:8px;padding:8px 12px;white-space:pre-wrap}
  .note b{font-weight:600}
  .ownerbox textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;resize:vertical}
  .chartbtn{display:inline-block;margin:10px 8px 0 0;font-size:15px;font-weight:600;border:0;border-radius:10px;
    padding:10px 18px;background:#0f766e;color:#fff;cursor:pointer}
  .chartbtn:hover{background:#0b5f58}
  .gear{position:absolute;top:14px;right:16px;font-size:20px;background:none;border:0;cursor:pointer;opacity:.35}
  .gear:hover{opacity:.8}
  .ownerbox{margin-top:12px;padding:12px;border:1px dashed var(--accent);border-radius:10px;background:#f5f8ff}
  .ownerbox label{display:block;font-size:12.5px;color:var(--dim);margin:8px 0 3px}
  .ownerbox input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  .ownerbox .obtn{margin-top:10px;border:0;border-radius:8px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;background:var(--accent);color:#fff}
  .ownerbox .odel{background:#b91c1c;margin-left:8px}
  .ownerbox .omsg{margin-left:10px;font-size:13px;color:var(--ok)}
  .ownerbox .ohint{font-size:12px;color:var(--dim);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <button id="gear" class="gear" title="Режим владельца">⚙</button>
  <h1>Поиск товара</h1>
  <p class="sub">Введите артикул или название — покажем фото, название, описание и наличие.</p>

  <div class="searchbar">
    <input id="q" type="text" placeholder="Артикул или название, напр. Ads-160 или «куртка»" autocomplete="off" enterkeyhint="search">
    <button id="go">Найти</button>
  </div>

  <div id="status" class="status">Введите артикул или название и нажмите «Найти».</div>
  <div id="result"></div>
</div>

<div class="lightbox" id="lb"><img id="lbimg" alt=""></div>

<script>
const WORKER_URL = 'https://cold-sea-36e7tovary.bonnashops.workers.dev';
const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const PRES_YES = ['В наличии','Под заказ','Ожидается поставка'];

// Полноразмерное фото: у Prom в ссылке бывает размерная вставка (_w200_h200),
// убираем её и получаем оригинал в полном качестве (как на сайте).
function fullImg(u){
  u = String(u||'');
  if(u.indexOf('images.prom.ua') !== -1){
    u = u.replace(/_w\d+/gi,'').replace(/_h\d+/gi,'').replace(/_fill|_square|_pad/gi,'');
  }
  return u;
}
let OWNER = !!localStorage.getItem('search:pass');
let currentProduct = null;
let pendingChart = null;   // подготовленное фото сетки (dataURL) до сохранения

function money(v){
  if(v==null||v==='') return '—';
  const n=Number(v); if(!isFinite(n)) return esc(v);
  return n.toLocaleString('uk-UA').replace(/,/g,' ')+' ₴';
}
function setStatus(msg, err){ $('status').className='status'+(err?' err':''); $('status').textContent=msg; }

function overallPresence(stores){
  const vals = Object.values(stores||{}).map(s=>String(s&&s.presence==null?'':s.presence)).filter(Boolean);
  if(!vals.length) return { text:'—', yes:false };
  for(const key of ['В наличии','Под заказ','Ожидается поставка']){
    const hit = vals.find(v=>v.indexOf(key)===0);
    if(hit) return { text:hit, yes:true };
  }
  const no = vals.find(v=>v.indexOf('Нет в наличии')===0);
  return { text: no||vals[0], yes:false };
}
function descBlock(html){
  return '<div class="desc"><h3>Описание</h3><div class="desc-body">'+html+'</div></div>';
}
function galleryHtml(imgs){
  if(!imgs || !imgs.length) return '';
  return '<div class="main"><img id="mainimg" src="'+esc(imgs[0])+'" alt=""></div>'+
    (imgs.length>1 ? '<div class="thumbs">'+imgs.map((u,i)=>'<img data-u="'+esc(u)+'" class="'+(i===0?'sel':'')+'" src="'+esc(u)+'" alt="">').join('')+'</div>' : '');
}
function bindGallery(){
  const main=$('mainimg');
  document.querySelectorAll('.thumbs img').forEach(t=>t.addEventListener('click',()=>{
    if(main) main.src=t.dataset.u;
    document.querySelectorAll('.thumbs img').forEach(x=>x.classList.remove('sel')); t.classList.add('sel');
  }));
  if(main) main.addEventListener('click',()=>{ $('lbimg').src=main.src; $('lb').classList.add('on'); });
}
async function loadDetail(d, needDesc, needImg){
  const slot = needDesc ? document.getElementById('desc-slot') : null;
  if(slot) slot.innerHTML='<div class="desc"><div class="desc-body" style="color:var(--dim)">Загружаю описание…</div></div>';
  try{
    const res=await fetch(WORKER_URL.replace(/\/+$/,'')+'/detail',{
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(d)
    });
    const j=await res.json();
    console.log('[detail ответ] '+JSON.stringify({ ok:j&&j.ok, error:j&&j.error, descLen:(j&&j.description||'').length, keys:j&&j.keys }));
    if(j && j.ok){
      if(slot) slot.innerHTML = j.description ? descBlock(j.description) : '';   // товар без описания — тихо
    } else {
      console.warn('detail не сработал:', j);
      if(slot) slot.innerHTML='<div class="desc"><div class="desc-body" style="color:var(--dim)">Описание временно недоступно.</div></div>';
    }
    if(needImg && j && j.ok && Array.isArray(j.images) && j.images.length){
      const g=document.getElementById('gallery-slot');
      if(g){ g.innerHTML=galleryHtml(j.images.map(fullImg)); bindGallery(); }
    }
  }catch(e){
    console.warn('detail ошибка сети:', e);
    if(slot) slot.innerHTML='<div class="desc"><div class="desc-body" style="color:var(--dim)">Описание временно недоступно.</div></div>';
  }
}
async function lookup(q){
  const res = await fetch(WORKER_URL.replace(/\/+$/,'')+'/lookup', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ q })
  });
  return res.json();
}

function render(p){
  currentProduct = p;
  const imgs = (Array.isArray(p.images)?p.images.filter(Boolean):[]).map(fullImg);
  const gallery = '<div class="gallery" id="gallery-slot">'+galleryHtml(imgs)+'</div>';

  const fitLine  = p.fit ? '<div class="fit">'+esc(p.fit)+'</div>' : '';
  const noteLine = p.note ? '<div class="note"><b>Замітки:</b> '+esc(p.note).replace(/\n/g,'<br>')+'</div>' : '';
  const chartBtn = p.hasChart ? '<button class="chartbtn" id="chart-open">Розмірна сітка</button>' : '';

  const ownerPanel = OWNER ? (
    '<div class="ownerbox">'+
      '<label>Заметка о размере (маломерит / большемерит):</label>'+
      '<input id="fit-inp" type="text" value="'+esc(p.fit||'')+'" placeholder="напр. Маломерит — берите на размер больше">'+
      '<label>Замітки:</label>'+
      '<textarea id="note-inp" rows="3" placeholder="другая информация о товаре">'+esc(p.note||'')+'</textarea>'+
      '<label>Размерная сетка (фото):</label>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+
        '<input id="chart-file" type="file" accept="image/*">'+
        '<button class="obtn" id="chart-paste" type="button" style="background:#334155">Вставить из буфера</button>'+
      '</div>'+
      '<div class="ohint">'+(p.hasChart?'Фото сетки загружено.':'Фото сетки пока нет.')+' Выберите файл, либо скопируйте картинку и нажмите «Вставить из буфера» (или Ctrl+V прямо здесь).</div>'+
      '<div id="chart-preview-wrap" style="display:none;margin-top:8px"><img id="chart-preview" style="max-width:200px;max-height:200px;border:1px solid var(--line);border-radius:8px"><div class="ohint">Новое фото готово — нажмите «Сохранить».</div></div>'+
      '<div><button class="obtn" id="extra-save">Сохранить</button>'+
      (p.hasChart?'<button class="obtn odel" id="chart-del">Удалить сетку</button>':'')+
      '<span class="omsg" id="extra-msg"></span></div>'+
    '</div>'
  ) : '';

  const desc = p.desc ? descBlock(p.desc) : '<div id="desc-slot"></div>';

  $('result').innerHTML =
    '<div class="card">'+
      '<div class="top">'+ gallery +
        '<div class="info">'+
          (p.category?'<span class="cat">'+esc(p.category)+'</span><br>':'')+
          '<div class="name">'+esc(p.name)+'</div>'+
          '<p class="art">Артикул: <b>'+esc(p.base)+'</b></p>'+
          fitLine +
          noteLine +
          (chartBtn?'<div>'+chartBtn+'</div>':'')+
          ownerPanel +
        '</div>'+
      '</div>'+ desc +
    '</div>';

  bindGallery();
  const co=$('chart-open'); if(co) co.addEventListener('click', ()=>openChart(p));
  if(OWNER){
    pendingChart = null;
    const sv=$('extra-save'); if(sv) sv.addEventListener('click', ()=>saveExtra(p));
    const dl=$('chart-del'); if(dl) dl.addEventListener('click', ()=>removeChart(p));
    const cf=$('chart-file'); if(cf) cf.addEventListener('change', onChartFile);
    const cp=$('chart-paste'); if(cp) cp.addEventListener('click', pasteChart);
  }

  // описания/фото нет в индексе — догружаем из карточки главного товара
  if(p.detail && (!p.desc || !imgs.length)){
    loadDetail(p.detail, !p.desc, !imgs.length);
  } else if(!p.desc && !p.detail){
    const slot=document.getElementById('desc-slot');
    if(slot) slot.innerHTML='<div class="desc"><div class="desc-body" style="color:var(--dim)">Нет ссылки на товар — переопубликуйте каталог (кнопка «Собрать и опубликовать»).</div></div>';
  }
}

/* ---- стабильный ключ товара (та же формула, что в worker.js) ---- */
function extraKey(p){
  if(p && p.detail && p.detail.id) return 'pid:'+p.detail.store+':'+p.detail.id;
  return 'art:'+(p ? p.base : '');
}

/* ---- размерная сетка: открыть фото ---- */
async function openChart(p){
  try{
    const res=await fetch(WORKER_URL.replace(/\/+$/,'')+'/chart',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ key: p.ekey||extraKey(p), base: p.base })
    });
    const j=await res.json();
    if(j && j.ok && j.chart){ $('lbimg').src=j.chart; $('lb').classList.add('on'); }
    else alert('Фото размерной сетки не найдено.');
  }catch(e){ alert('Не удалось загрузить сетку: '+e.message); }
}

/* ---- режим владельца: сохранение заметки и фото сетки ---- */
function ownerPass(){ return localStorage.getItem('search:pass')||''; }
function fileToDataURL(file, maxW){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width, h=img.height;
      if(maxW && w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/jpeg',0.85));
    };
    img.onerror=reject;
    const fr=new FileReader();
    fr.onload=()=>{ img.src=fr.result; };
    fr.onerror=reject;
    fr.readAsDataURL(file);
  });
}
async function extraSet(payload){
  const res=await fetch(WORKER_URL.replace(/\/+$/,'')+'/extra-set',{
    method:'POST', headers:{'Content-Type':'application/json','X-App-Password':ownerPass()},
    body: JSON.stringify(payload)
  });
  return res.json();
}
function showChartPreview(){
  const wrap=$('chart-preview-wrap'), im=$('chart-preview');
  if(wrap && im && pendingChart){ im.src=pendingChart; wrap.style.display='block'; }
}
async function onChartFile(){
  const file=$('chart-file').files[0]; if(!file) return;
  if(file.size>15*1024*1024){ alert('Фото слишком большое (>15 МБ).'); return; }
  pendingChart=await fileToDataURL(file, 1200); showChartPreview();
}
async function pasteChart(){
  // 1) пробуем современный доступ к буферу
  try{
    if(navigator.clipboard && navigator.clipboard.read){
      const items=await navigator.clipboard.read();
      for(const it of items){
        const type=(it.types||[]).find(t=>t.indexOf('image/')===0);
        if(type){ const blob=await it.getType(type); pendingChart=await fileToDataURL(blob,1200); showChartPreview(); return; }
      }
      alert('В буфере нет картинки. Скопируйте изображение и попробуйте снова (или нажмите сюда и Ctrl+V).');
      return;
    }
  }catch(e){ /* упадём в подсказку про Ctrl+V */ }
  alert('Ваш браузер не даёт прочитать буфер кнопкой. Просто нажмите Ctrl+V в этом окне — фото вставится.');
}
async function saveExtra(p){
  const msg=$('extra-msg'); if(msg){ msg.style.color='var(--dim)'; msg.textContent='Сохраняю…'; }
  try{
    const fit=($('fit-inp').value||'').trim();
    const note=($('note-inp').value||'').trim();
    // key — новый стабильный ключ; base — для совместимости со старой версией воркера
    const payload={ key:p.ekey||extraKey(p), base:p.base, fit, note };
    if(pendingChart) payload.chart=pendingChart;
    const j=await extraSet(payload);
    if(j && j.ok){
      p.fit=fit; p.note=note; if(payload.chart) p.hasChart=true;
      pendingChart=null;
      if(msg){ msg.style.color='var(--ok)'; msg.textContent='Сохранено ✓'; }
      render(p);
    } else {
      if(msg){ msg.style.color='var(--err)'; msg.textContent='Ошибка: '+((j&&j.error)||'не сохранилось (пароль?)'); }
    }
  }catch(e){ if(msg){ msg.style.color='var(--err)'; msg.textContent='Сбой: '+e.message; } }
}
async function removeChart(p){
  if(!confirm('Удалить фото размерной сетки для этого товара?')) return;
  const j=await extraSet({ key:p.ekey||extraKey(p), base:p.base, chart:'' });
  if(j && j.ok){ p.hasChart=false; render(p); }
  else alert('Не удалось удалить (пароль?).');
}

/* ---- поиск по названию (по лёгкому списку из облака) ---- */
let CATALOG=null;
async function ensureCatalog(){
  if(CATALOG) return CATALOG;
  const res=await fetch(WORKER_URL.replace(/\/+$/,'')+'/catalog',{
    method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'
  });
  const j=await res.json();
  CATALOG=(j && Array.isArray(j.list)) ? j.list : [];
  return CATALOG;
}
function renderResults(matches, total){
  const html = matches.map(m=>
    '<button class="ritem" data-b="'+esc(m.b)+'">'+
      (m.img?'<img src="'+esc(m.img)+'" alt="">':'<img alt="">')+
      '<span><span class="rn">'+esc(m.n)+'</span><br><span class="ra">Артикул: '+esc(m.b)+'</span></span>'+
    '</button>').join('');
  $('result').innerHTML='<div class="results">'+html+'</div>';
  document.querySelectorAll('.ritem').forEach(b=>b.addEventListener('click',()=>openBase(b.dataset.b)));
  $('status').style.display='block';
  setStatus('Найдено по названию: '+total+(total>matches.length?(' (показаны первые '+matches.length+')'):'')+'. Нажмите на товар.');
}
async function openBase(base){
  $('result').innerHTML=''; setStatus('Открываю…'); $('status').style.display='block';
  try{
    const data=await lookup(base);
    if(data && data.found && data.product){ $('status').style.display='none'; render(data.product); }
    else setStatus('Не удалось открыть товар.', true);
  }catch(e){ setStatus('Ошибка связи: '+e.message, true); }
}

async function doSearch(){
  const q=$('q').value.trim();
  if(!q){ setStatus('Введите артикул или название.'); return; }
  $('go').disabled=true; $('result').innerHTML=''; setStatus('Ищу…'); $('status').style.display='block';
  try{
    // 1) точный поиск по артикулу
    const data=await lookup(q);
    if(data && data.found && data.product){ $('status').style.display='none'; render(data.product); return; }

    // 2) поиск по названию (и по части артикула) в списке
    const list=await ensureCatalog();
    const ql=q.toLowerCase();
    const found=list.filter(m=> (m.n&&m.n.toLowerCase().indexOf(ql)!==-1) || (m.b&&m.b.toLowerCase().indexOf(ql)!==-1));
    if(found.length===1){ await openBase(found[0].b); return; }
    if(found.length>1){ renderResults(found.slice(0,60), found.length); return; }
    setStatus('Ничего не найдено по запросу «'+q+'». Проверьте артикул/название или обновите публикацию.', true);
  }catch(e){ setStatus('Ошибка связи: '+e.message, true); }
  finally{ $('go').disabled=false; }
}

$('go').addEventListener('click',doSearch);
$('q').addEventListener('keydown',e=>{ if(e.key==='Enter') doSearch(); });
$('lb').addEventListener('click',()=>$('lb').classList.remove('on'));

/* вставка фото сетки из буфера через Ctrl+V (в режиме владельца) */
document.addEventListener('paste', async (e)=>{
  if(!OWNER || !currentProduct) return;
  const items = e.clipboardData && e.clipboardData.items; if(!items) return;
  for(const it of items){
    if(it.type && it.type.indexOf('image/')===0){
      const blob=it.getAsFile();
      if(blob){ pendingChart=await fileToDataURL(blob,1200); showChartPreview(); e.preventDefault(); }
      return;
    }
  }
});

/* ---- вход/выход из режима владельца (шестерёнка) ---- */
$('gear').addEventListener('click', ()=>{
  if(OWNER){
    if(confirm('Выйти из режима владельца?')){ localStorage.removeItem('search:pass'); OWNER=false; $('gear').style.color=''; if(currentProduct) render(currentProduct); }
    return;
  }
  const p=prompt('Пароль владельца (APP_PASSWORD):');
  if(p){ localStorage.setItem('search:pass', p); OWNER=true; $('gear').style.color='#2563eb'; if(currentProduct) render(currentProduct); }
});
if(OWNER) $('gear').style.color='#2563eb';
$('q').focus();
</script>
