<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <title>Товары — портал приложений</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="assets/portal.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="brand__name">ТОВАРЫ<span class="slash">//</span></div>
      <div class="brand__sub">Внутренний портал приложений</div>
    </div>
  </header>

  <main class="wrap">
    <p class="eyebrow">Выберите приложение</p>
    <div class="grid" id="grid"></div>
  </main>

  <script>
    /* =====================================================================
       СПИСОК ПРИЛОЖЕНИЙ
       ---------------------------------------------------------------------
       Чтобы добавить новое приложение — допишите объект в массив APPS.
         icon   — эмодзи или символ
         title  — название
         desc   — короткое описание
         href   — путь к приложению (папка внутри /apps/…)
         status — 'active' (кликабельно) или 'soon' (серым, «Скоро»)
       ===================================================================== */
    const APPS = [
      {
        icon:   '🧬',
        title:  'Клонирование товаров',
        desc:   'Из выгрузки Black Street делает файлы импорта для Bonna, Core22 (Prom) и Blink (Хорошоп): суффиксы (B)/(С), цена со скидкой, характеристики, размеры.',
        href:   'apps/clone/index.html',
        status: 'active'
      },
      {
        icon:   '💰',
        title:  'Цены и наличие',
        desc:   'Массовая правка цен, скидок, наличия и видимости по трём магазинам. Разновидности и шаг цены между магазинами.',
        href:   'apps/catalog/index.html',
        status: 'active'
      },
      {
        icon:   '📤',
        title:  'Публикация для колл-центра',
        desc:   'Собирает свежие данные со всех магазинов (артикул, фото, название, описание, цена, наличие) и выкладывает в облако для поиска колл-центра. Запускать после обновления цен/наличия.',
        href:   'apps/publish/index.html',
        status: 'active'
      },
      {
        icon:   '🛡️',
        title:  'Аудит артикулов',
        desc:   'Проверяет артикулы на всех 4 магазинах: где на главном товаре и разновидностях разные артикулы, и что не сходится с эталоном Black Street (лишние, отсутствующие, изменённые). Отчёты по каждому магазину + выгрузка в CSV.',
        href:   'apps/audit/index.html',
        status: 'active'
      },
      {
        icon:   '🔎',
        title:  'Поиск для колл-центра',
        desc:   'Онлайн-страница для операторов: артикул или название → фото, описание, наличие. Без паролей. Ссылку давайте колл-центру.',
        href:   'apps/search/index.html',
        status: 'active',
        share:  true
      },
      {
        icon:   '🧩',
        title:  'Пример приложения',
        desc:   'Шаблон-образец: кнопка «Главная» сверху и сохранение настроек при обновлении страницы. Скопируйте его под своё приложение.',
        href:   'apps/example/index.html',
        status: 'active'
      }
    ];

    /* ---- Отрисовка карточек (менять обычно не нужно) -------------------- */
    const grid = document.getElementById('grid');

    const esc = (s) => String(s).replace(/[&<>"]/g, c => (
      { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]
    ));

    // абсолютный адрес для ссылки, которую дают колл-центру
    const abs = (href) => new URL(href, location.href).href;

    const btn = 'display:inline-block;border:0;border-radius:8px;padding:9px 14px;font:600 13.5px system-ui,sans-serif;cursor:pointer;text-decoration:none;';

    grid.innerHTML = APPS.map((app, i) => {
      const active = app.status === 'active';
      const badge = active
        ? '<span class="badge badge--active"><span class="dot"></span>Активно</span>'
        : '<span class="badge badge--soon">Скоро</span>';

      // Особая карточка «Поиск для колл-центра»: не переход, а кнопки со ссылкой
      if (app.share) {
        const url = abs(app.href);
        return `
          <div class="card" style="cursor:default">
            <div class="card__icon">${esc(app.icon)}</div>
            <h2 class="card__title">${esc(app.title)}</h2>
            <p class="card__desc">${esc(app.desc)}</p>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 8px">
              <a href="${esc(app.href)}" target="_blank" rel="noopener" style="${btn}background:#2563eb;color:#fff">Открыть поиск ↗</a>
              <button type="button" data-copy="${esc(url)}" style="${btn}background:#333b47;color:#e7ecf3">Копировать ссылку</button>
            </div>
            <div style="font:12px ui-monospace,Menlo,monospace;color:#8a94a2;word-break:break-all;margin-bottom:8px">${esc(url)}</div>
            <div class="card__foot">${badge}</div>
          </div>`;
      }

      const tag = active ? 'a' : 'div';
      const hrefAttr = active ? ` href="${esc(app.href)}"` : '';
      const cls = active ? 'card' : 'card card--soon';
      const arrow = active ? '<span class="card__arrow">↗</span>' : '';

      return `
        <${tag} class="${cls}"${hrefAttr}>
          <div class="card__icon">${esc(app.icon)}</div>
          ${arrow}
          <h2 class="card__title">${esc(app.title)}</h2>
          <p class="card__desc">${esc(app.desc)}</p>
          <div class="card__foot">${badge}</div>
        </${tag}>`;
    }).join('');

    // копирование ссылки на поиск
    grid.addEventListener('click', (e) => {
      const b = e.target.closest('[data-copy]');
      if (!b) return;
      const url = b.getAttribute('data-copy');
      const done = () => { const t = b.textContent; b.textContent = 'Скопировано ✓'; setTimeout(() => b.textContent = t, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(done).catch(() => { window.prompt('Скопируйте ссылку:', url); });
      } else {
        window.prompt('Скопируйте ссылку:', url);
      }
    });
  </script>

</body>
</html>
