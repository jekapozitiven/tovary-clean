<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Поиск товара по артикулу</title>
<link rel="icon" href="../../favicon.svg">
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --line:#e3e8ef; --text:#1f2733; --dim:#6b7686;
    --accent:#2563eb; --ok:#15803d; --warn:#b45309; --err:#b91c1c; --chip:#eef2f7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:28px 16px 70px}
  h1{font-size:22px;margin:0 0 4px;text-align:center}
  .sub{color:var(--dim);text-align:center;margin:0 0 22px;font-size:14px}
  .searchbar{display:flex;gap:10px;position:sticky;top:0;background:var(--bg);padding:8px 0 12px;z-index:5}
  #q{flex:1;font-size:19px;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--text)}
  #q:focus{outline:none;border-color:var(--accent)}
  #go{font-size:18px;font-weight:600;padding:0 26px;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
  #go:disabled{opacity:.6}
  .status{text-align:center;color:var(--dim);margin:22px 0;font-size:15px}
  .status.err{color:var(--err)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:0 1px 3px rgba(20,30,50,.06);margin-top:8px}
  .top{display:flex;gap:18px;padding:18px;flex-wrap:wrap}
  .gallery{flex:0 0 260px}
  .gallery .main{width:260px;height:260px;border:1px solid var(--line);border-radius:12px;background:#fafbfc;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .gallery .main img{max-width:100%;max-height:100%;object-fit:contain}
  .thumbs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .thumbs img{width:52px;height:52px;object-fit:cover;border:1px solid var(--line);border-radius:8px;cursor:pointer}
  .thumbs img.sel{border-color:var(--accent)}
  .info{flex:1 1 300px;min-width:260px}
  .name{font-size:20px;font-weight:700;margin:0 0 6px}
  .cat{display:inline-block;background:var(--chip);color:var(--dim);font-size:12.5px;padding:3px 9px;border-radius:20px;margin-bottom:10px}
  .art{font-size:15px;color:var(--dim);margin:0 0 12px}
  .art b{color:var(--text);font-size:17px}
  table.stores{width:100%;border-collapse:collapse;margin-top:6px;font-size:14.5px}
  table.stores th,table.stores td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  table.stores th{color:var(--dim);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.02em}
  .price{font-weight:700;white-space:nowrap}
  .old{color:var(--dim);text-decoration:line-through;font-size:13px;margin-left:6px}
  .pres{font-size:13.5px}
  .pres.yes{color:var(--ok)}.pres.no{color:var(--err)}
  .avail{display:inline-block;margin-top:8px;font-size:17px;font-weight:700;padding:8px 16px;border-radius:10px}
  .avail.yes{color:#0f7a33;background:#e7f6ec}
  .avail.no{color:#a51f1f;background:#fbeaea}
  .hidden-badge{color:var(--warn);font-size:12px}
  .results{margin-top:8px}
  .ritem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-size:15px}
  .ritem:hover{border-color:var(--accent)}
  .ritem img{width:44px;height:44px;object-fit:cover;border-radius:8px;background:#f0f2f5;flex:0 0 44px}
  .ritem .rn{font-weight:600}
  .ritem .ra{color:var(--dim);font-size:13px}
  .desc{padding:0 18px 20px}
  .desc h3{font-size:14px;color:var(--dim);text-transform:uppercase;letter-spacing:.03em;margin:6px 0 8px}
  .desc-body{font-size:15px;line-height:1.6;border-top:1px solid var(--line);padding-top:12px;max-height:520px;overflow:auto}
  .desc-body img{max-width:100%;height:auto}
  .lightbox{position:fixed;inset:0;background:rgba(10,15,25,.85);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .lightbox.on{display:flex}
  .lightbox img{max-width:95%;max-height:95%;object-fit:contain;border-radius:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Поиск товара</h1>
  <p class="sub">Введите артикул или название — покажем фото, название, описание и наличие.</p>

  <div class="searchbar">
    <input id="q" type="text" placeholder="Артикул или название, напр. Ads-160 или «куртка»" autocomplete="off" enterkeyhint="search">
    <button id="go">Найти</button>
  </div>

  <div id="status" class="status">Введите артикул или название и нажмите «Найти».</div>
  <div id="result"></div>
</div>

<div class="lightbox" id="lb"><img id="lbimg" alt=""></div>

<script>
const WORKER_URL = 'https://cold-sea-36e7tovary.bonnashops.workers.dev';
const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const PRES_YES = ['В наличии','Под заказ','Ожидается поставка'];

function money(v){
  if(v==null||v==='') return '—';
  const n=Number(v); if(!isFinite(n)) return esc(v);
  return n.toLocaleString('uk-UA').replace(/,/g,' ')+' ₴';
}
function setStatus(msg, err){ $('status').className='status'+(err?' err':''); $('status').textContent=msg; }

function overallPresence(stores){
  const vals = Object.values(stores||{}).map(s=>String(s&&s.presence==null?'':s.presence)).filter(Boolean);
  if(!vals.length) return { text:'—', yes:false };
  for(const key of ['В наличии','Под заказ','Ожидается поставка']){
    const hit = vals.find(v=>v.indexOf(key)===0);
    if(hit) return { text:hit, yes:true };
  }
  const no = vals.find(v=>v.indexOf('Нет в наличии')===0);
  return { text: no||vals[0], yes:false };
}
function descBlock(html){
  return '<div class="desc"><h3>Описание</h3><div class="desc-body">'+html+'</div></div>';
}
function galleryHtml(imgs){
  if(!imgs || !imgs.length) return '';
  return '<div class="main"><img id="mainimg" src="'+esc(imgs[0])+'" alt=""></div>'+
    (imgs.length>1 ? '<div class="thumbs">'+imgs.map((u,i)=>'<img data-u="'+esc(u)+'" class="'+(i===0?'sel':'')+'" src="'+esc(u)+'" alt="">').join('')+'</div>' : '');
}
function bindGallery(){
  const main=$('mainimg');
  document.querySelectorAll('.thumbs img').forEach(t=>t.addEventListener('click',()=>{
    if(main) main.src=t.dataset.u;
    document.querySelectorAll('.thumbs img').forEach(x=>x.classList.remove('sel')); t.classList.add('sel');
  }));
  if(main) main.addEventListener('click',()=>{ $('lbimg').src=main.src; $('lb').classList.add('on'); });
}
async function loadDetail(d, needDesc, needImg){
  const slot = needDesc ? document.getElementById('desc-slot') : null;
  if(slot) slot.innerHTML='<div class="desc"><div class="desc-body" style="color:var(--dim)">Загружаю описание…</div></div>';
  try{
    const res=await fetch(WORKER_URL.replace(/\/+$/,'')+'/detail',{
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(d)
    });
    const j=await res.json();
    if(slot) slot.innerHTML = (j && j.ok && j.description) ? descBlock(j.description) : '';
    if(needImg && j && j.ok && Array.isArray(j.images) && j.images.length){
      const g=document.getElementById('gallery-slot');
      if(g){ g.innerHTML=galleryHtml(j.images); bindGallery(); }
    }
  }catch(e){ if(slot) slot.innerHTML=''; }
}
async function lookup(q){
  const res = await fetch(WORKER_URL.replace(/\/+$/,'')+'/lookup', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ q })
  });
  return res.json();
}

function render(p){
  const imgs = Array.isArray(p.images)?p.images.filter(Boolean):[];
  const gallery = '<div class="gallery" id="gallery-slot">'+galleryHtml(imgs)+'</div>';

  const av = overallPresence(p.stores);
  const avail = '<div class="avail '+(av.yes?'yes':'no')+'">'+esc(av.text)+'</div>';

  const desc = p.desc ? descBlock(p.desc) : '<div id="desc-slot"></div>';

  $('result').innerHTML =
    '<div class="card">'+
      '<div class="top">'+ gallery +
        '<div class="info">'+
          (p.category?'<span class="cat">'+esc(p.category)+'</span><br>':'')+
          '<div class="name">'+esc(p.name)+'</div>'+
          '<p class="art">Артикул: <b>'+esc(p.base)+'</b></p>'+
          avail+
        '</div>'+
      '</div>'+ desc +
    '</div>';

  bindGallery();

  // описания/фото нет в индексе — догружаем из карточки главного товара
  if(p.detail && (!p.desc || !imgs.length)){ loadDetail(p.detail, !p.desc, !imgs.length); }
}

/* ---- поиск по названию (по лёгкому списку из облака) ---- */
let CATALOG=null;
async function ensureCatalog(){
  if(CATALOG) return CATALOG;
  const res=await fetch(WORKER_URL.replace(/\/+$/,'')+'/catalog',{
    method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'
  });
  const j=await res.json();
  CATALOG=(j && Array.isArray(j.list)) ? j.list : [];
  return CATALOG;
}
function renderResults(matches, total){
  const html = matches.map(m=>
    '<button class="ritem" data-b="'+esc(m.b)+'">'+
      (m.img?'<img src="'+esc(m.img)+'" alt="">':'<img alt="">')+
      '<span><span class="rn">'+esc(m.n)+'</span><br><span class="ra">Артикул: '+esc(m.b)+'</span></span>'+
    '</button>').join('');
  $('result').innerHTML='<div class="results">'+html+'</div>';
  document.querySelectorAll('.ritem').forEach(b=>b.addEventListener('click',()=>openBase(b.dataset.b)));
  $('status').style.display='block';
  setStatus('Найдено по названию: '+total+(total>matches.length?(' (показаны первые '+matches.length+')'):'')+'. Нажмите на товар.');
}
async function openBase(base){
  $('result').innerHTML=''; setStatus('Открываю…'); $('status').style.display='block';
  try{
    const data=await lookup(base);
    if(data && data.found && data.product){ $('status').style.display='none'; render(data.product); }
    else setStatus('Не удалось открыть товар.', true);
  }catch(e){ setStatus('Ошибка связи: '+e.message, true); }
}

async function doSearch(){
  const q=$('q').value.trim();
  if(!q){ setStatus('Введите артикул или название.'); return; }
  $('go').disabled=true; $('result').innerHTML=''; setStatus('Ищу…'); $('status').style.display='block';
  try{
    // 1) точный поиск по артикулу
    const data=await lookup(q);
    if(data && data.found && data.product){ $('status').style.display='none'; render(data.product); return; }

    // 2) поиск по названию (и по части артикула) в списке
    const list=await ensureCatalog();
    const ql=q.toLowerCase();
    const found=list.filter(m=> (m.n&&m.n.toLowerCase().indexOf(ql)!==-1) || (m.b&&m.b.toLowerCase().indexOf(ql)!==-1));
    if(found.length===1){ await openBase(found[0].b); return; }
    if(found.length>1){ renderResults(found.slice(0,60), found.length); return; }
    setStatus('Ничего не найдено по запросу «'+q+'». Проверьте артикул/название или обновите публикацию.', true);
  }catch(e){ setStatus('Ошибка связи: '+e.message, true); }
  finally{ $('go').disabled=false; }
}

$('go').addEventListener('click',doSearch);
$('q').addEventListener('keydown',e=>{ if(e.key==='Enter') doSearch(); });
$('lb').addEventListener('click',()=>$('lb').classList.remove('on'));
$('q').focus();
</script>
</body>
</html>
